# XcodeGen spec: `xcodegen generate` (run in platform/ios) creates J2ME4iOS.xcodeproj.
# The runtime jar must be built first: tools/build_runtime.sh
name: J2ME4iOS
options:
  bundleIdPrefix: com.j2me4ios
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GCC_C_LANGUAGE_STANDARD: gnu11
    CLANG_ENABLE_OBJC_ARC: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    GCC_OPTIMIZATION_LEVEL: "2"
    ENABLE_BITCODE: NO
targets:
  J2ME4iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../core
        group: Core
      - path: ../../build/j4i-runtime.jar
        buildPhase: resources
        optional: true
      - path: Resources
        optional: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: J2ME4iOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Java Archive (MIDlet)
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.sun.java-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.sun.java-archive
            UTTypeDescription: Java Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - jar
              public.mime-type:
                - application/java-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j2me4ios.app
        PRODUCT_NAME: J2ME4iOS
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../core
        OTHER_CFLAGS: -fno-strict-aliasing -Wno-unused-parameter -Wno-shorten-64-to-32 -Wno-comma
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: ImageIO.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: UniformTypeIdentifiers.framework
