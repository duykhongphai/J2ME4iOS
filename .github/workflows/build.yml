name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: VM core (Linux) + language tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2>&1 | tee cmake-build.log
          grep -E ': (fatal )?error: ' cmake-build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          test -x build/j4i-headless
      - name: Language tests (JVM vs J2ME4iOS)
        run: bash tests/run_lang_test.sh "$PWD/build/j4i-headless"
      - name: File, tone and vendor API tests
        run: bash tests/run_io_test.sh "$PWD/build/j4i-headless"
      - name: Several VMs at once, proxies
        run: bash tests/run_multi_test.sh "$PWD/build/j4i-headless"

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build runtime jar
        run: bash tools/build_runtime.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd platform/ios && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project platform/ios/J2ME4iOS.xcodeproj -target J2ME4iOS -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > xcodebuild.log 2>&1 && rc=0 || rc=$?
          # surface compiler errors as annotations (readable without downloading logs)
          grep -E ': (fatal )?error: ' xcodebuild.log | sort -u | head -60 | while IFS= read -r line; do
            echo "::error::${line#$PWD/}"
          done
          tail -40 xcodebuild.log
          test $rc -eq 0
          test -d build/ios/Release-iphoneos/J2ME4iOS.app
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Release-iphoneos/J2ME4iOS.app build/ipa/Payload/
          cd build/ipa && zip -qr ../J2ME4iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: J2ME4iOS-unsigned-ipa
          path: build/J2ME4iOS-unsigned.ipa
